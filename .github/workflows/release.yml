name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  sundials:
    uses: PlanetesLAB/release-workflows/.github/workflows/release.yml@v1
    with:
      manifest: sundials/Cargo.toml
      tag-prefix: sundials-v
      submodules: true
      apt-packages: "libclang-dev libsuitesparse-dev cmake"
      test-command: cargo test --all-features --workspace
    secrets:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}

  sundials-sys:
    uses: PlanetesLAB/release-workflows/.github/workflows/release.yml@v1
    with:
      manifest: sundials-sys/Cargo.toml
      tag-prefix: sundials-sys-v
      submodules: true
      apt-packages: "libclang-dev libsuitesparse-dev cmake"
      test-command: cargo test --all-features --workspace
    secrets:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
